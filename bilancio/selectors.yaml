login_url: https://bilancio.agesci.it/login
account_name_pattern: '^(?:Cassa|Conto)\b'

selectors:
  cookie_accept:
    role: button
    name: OK
    exact: true
  username:
    role: textbox
    name: Username
    exact: true
  password:
    role: textbox
    name: Password
    exact: true
  login:
    role: button
    name: Entra
    exact: true
  scout_year_switch:
    role: button
    name_pattern: '^(?:Espandi|Comprimi) "\d{2}-\d{2}"$'
  scout_year_option:
    text_template: '{year_label}'
  scout_year_selected:
    role: button
    name_template: 'Espandi "{year_label}"'
    exact: true
  role_switch:
    role: button
    name_pattern: '^(?:Espandi|Comprimi) "(?:Capo unità|Tesoriere di gruppo) -'
  treasurer_role_selected:
    role: button
    name_pattern: '^Espandi "Tesoriere di gruppo -'
  role_entry:
    role: listitem
    text_contains: Tesoriere di gruppo -
  prima_nota:
    role: link
    name: Prima Nota
    exact: true
  account_links:
    role: link
  portal_option:
    role: option
  add_operation:
    role: button
    name: aggiungi operazione
    exact: true
  direction:
    role: radio
    name_template: '{direction_label}'
    exact: true
  accounting_voice:
    role: radio
    name_template: '{accounting_voice}'
    exact: true
  date:
    role: textbox
    name: Data Operazione
    exact: true
  description:
    role: textbox
    name: Descrizione
    exact: true
  amount:
    role: textbox
    name_pattern: '^Importo\b'
  transaction_type:
    role: combobox
    name_template: 'Tipologia {direction_label}'
    exact: true
  unit:
    role: combobox
    name: Unità
    exact: true
  category:
    role: combobox
    name: Categoria
    exact: true
  notes:
    role: textbox
    name: Note
    exact: true
  save:
    role: button
    name: Salva
    exact: true
  ledger_rows:
    role: row
  ledger_loading_overlay:
    selector: '#q-loading .q-loading__backdrop'
  ledger_page_indicator:
    text_pattern: '^\d+\s*-\s*\d+\s+di\s+\d+$'
  ledger_search:
    placeholder: Cerca
    exact: true
