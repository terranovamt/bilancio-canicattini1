<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Assemblea di Gruppo</title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
  <style>
    /* ============ COLORI: cambia solo qui ============ */
    :root {
      --y: #FDC500;
      --vd: #211638;
      --v: #462678;
      --v2: #6B478D;
      --vl: #AEB0D9;
      --g: #21A067;
      --r: #E74030;
      --p: #9B66A5;
      --b: #92B3D7;
      --b2: #78afe9;
      --be: #E5D6C7;
      --bg: #ECE9E6;
      --w: #fff;
      --k: #000;
      /* testi e sfondi */
      --ink: var(--vd);
      --muted: var(--v2);
      --line: var(--vl);
      --note: var(--vl);
      --track: var(--be);
      --out: var(--vd);
      --halo-a: color-mix(in srgb, var(--vl) 40%, transparent);
      --halo-b: color-mix(in srgb, var(--y) 20%, transparent);
      /* grafici */
      --c1: var(--v);
      --c2: var(--b2);
      --c3: var(--y);
      --c4: var(--g);
      --c5: var(--vl);
      --c6: var(--r);
      /* ciambella patrimonio */
      --pie1: var(--v);
      --pie2: var(--v2);
      --pie3: var(--r);
      --pie4: var(--g);
      --pie5: var(--y);
      --pie6: var(--vl);
      /* esito bilancio */
      --ok: var(--g);
      --ko: var(--r);
      --even: var(--v);
      --near: var(--v2);
      /* ombre e trasparenze */
      --shadow: color-mix(in srgb, var(--v) 13%, transparent);
      --shadow-strong: color-mix(in srgb, var(--v) 27%, transparent);
      --shadow-chart: color-mix(in srgb, var(--v) 20%, transparent);
      --shadow-row: color-mix(in srgb, var(--v) 9%, transparent);
      --shadow-hd: color-mix(in srgb, var(--vd) 33%, transparent);
      --glass: color-mix(in srgb, var(--vd) 80%, transparent);
      --dot-shadow: color-mix(in srgb, var(--k) 27%, transparent);
      --w85: color-mix(in srgb, var(--w) 85%, transparent);
      --w80: color-mix(in srgb, var(--w) 80%, transparent);
      --w72: color-mix(in srgb, var(--w) 72%, transparent);
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: var(--out);
      overflow: hidden;
      font-family: Montserrat, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--v)
    }

    /* palco 1280x720, scalato da fit() */
    #stage {
      position: absolute;
      left: 0;
      top: 0;
      width: 1280px;
      height: 720px;
      transform-origin: 0 0;
      overflow: hidden;
      background: var(--bg)
    }

    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transform: translateX(40px) scale(.99);
      transition: opacity .6s, transform .6s;
      background: radial-gradient(circle at 90% 10%, var(--halo-a) 0, transparent 45%), radial-gradient(circle at 5% 100%, var(--halo-b) 0, transparent 35%), var(--bg);
      overflow: hidden
    }

    .slide.in {
      opacity: 1;
      transform: none
    }

    .slide.out {
      opacity: 0;
      transform: translateX(-40px) scale(.99)
    }

    /* barra del titolo FISSA (fuori dalle slide) */
    .hd {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 72px;
      background: var(--v) url(img/texture.svg) center/cover;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 48px;
      box-shadow: 0 6px 24px var(--shadow-hd)
    }

    .hd span {
      color: var(--w);
      font: 700 30px "Palatino Linotype", "Book Antiqua", Georgia, serif;
      line-height: 1.05;
      letter-spacing: .5px;
      flex: 1;
      min-width: 0;
      padding-right: 16px;
      overflow-wrap: anywhere
    }

    .hd img {
      height: 50px
    }

    #hdr {
      z-index: 4;
      transition: opacity .4s, transform .5s
    }

    #hdr.off {
      opacity: 0;
      transform: translateY(-100%);
      pointer-events: none
    }

    #hdr>span {
      transition: opacity .25s
    }

    .a {
      position: absolute
    }

    .card {
      position: absolute;
      background: var(--w);
      border-radius: 24px;
      box-shadow: 0 12px 40px var(--shadow)
    }

    .k {
      font-size: 17px;
      font-weight: 500;
      opacity: .75
    }

    .num {
      font-size: 64px;
      font-weight: 800;
      color: var(--vd);
      font-variant-numeric: tabular-nums;
      letter-spacing: -1px;
      white-space: nowrap
    }

    /* righe (rendiconto, ordine del giorno) */
    .row {
      position: absolute;
      left: 56px;
      width: 600px;
      height: 60px;
      background: var(--w);
      border-radius: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 20px;
      box-shadow: 0 6px 20px var(--shadow-row);
      opacity: 0;
      transform: translateX(-24px);
      transition: .5s
    }

    .row.on {
      opacity: 1;
      transform: none
    }

    .row i {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      flex: none
    }

    .row span {
      flex: 1;
      font-size: 14px;
      line-height: 1.2;
      font-weight: 500
    }

    .row b {
      font-size: 19px;
      color: var(--vd);
      font-variant-numeric: tabular-nums
    }

    .fade {
      opacity: 0;
      transition: opacity .6s, transform .6s;
      transform: translateY(16px)
    }

    .fade.on {
      opacity: 1;
      transform: none
    }

    svg {
      position: absolute;
      left: 0;
      top: 0;
      overflow: visible
    }

    circle.seg {
      transition: stroke-dasharray 1s ease, stroke-dashoffset 1s ease
    }

    .red {
      color: var(--r) !important
    }

    .grn {
      color: var(--g) !important
    }

    .bar {
      position: absolute;
      border-radius: 12px 12px 0 0;
      height: 0;
      transition: height 1s cubic-bezier(.2, .8, .2, 1), opacity .5s;
      opacity: 0
    }

    /* slide divisore di sezione / titolo */
    .sec .l {
      position: absolute;
      left: 0;
      top: 0;
      width: 430px;
      height: 100%;
      background: var(--w);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      text-align: center;
      font-size: 15px;
      line-height: 1.4
    }

    .sec .l img {
      width: 250px
    }

    .sec .rr {
      position: absolute;
      left: 430px;
      right: 0;
      top: 0;
      bottom: 0;
      background: var(--v) url(img/texture.svg) center/cover;
      color: var(--w);
      text-align: right;
      padding: 0 70px;
      display: flex;
      flex-direction: column;
      justify-content: center
    }

    .sec h1 {
      font-size: 68px;
      font-weight: 300;
      line-height: 1.1;
      margin: 0;
      letter-spacing: 1px
    }

    .sec h1 b {
      font-weight: 800
    }

    .sec h2 {
      font-size: 26px;
      font-weight: 400;
      margin: 14px 0 0;
      opacity: .9
    }

    .sec .d {
      position: absolute;
      right: 50px;
      bottom: 36px;
      font-size: 20px;
      opacity: .9
    }

    .sec .rr:after {
      content: "";
      width: 120px;
      height: 6px;
      background: var(--y);
      border-radius: 3px;
      position: absolute;
      right: 70px;
      top: calc(50% - 130px)
    }

    /* testo / articoli: dimensione auto-adattiva (--fs) */
    .reg {
      position: absolute;
      left: 50px;
      right: 50px;
      top: 104px;
      bottom: 34px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: calc(var(--fs, 21px)*.8)
    }

    .reg>.art {
      flex: none
    }

    .art {
      background: var(--w);
      border-radius: 24px;
      padding: calc(var(--fs, 21px)*.9) calc(var(--fs, 21px)*1.4);
      box-shadow: 0 12px 40px var(--shadow);
      border-left: 12px solid var(--y)
    }

    .art h3 {
      margin: 0 0 calc(var(--fs, 21px)*.45);
      font-size: calc(var(--fs, 21px)*1.35);
      font-weight: 800;
      color: var(--vd);
      line-height: 1.15
    }

    .art ol {
      margin: 0;
      padding-left: calc(var(--fs, 21px)*1.5);
      font-size: var(--fs, 21px);
      line-height: 1.32;
      font-weight: 500;
      color: var(--ink)
    }

    .art li {
      margin: calc(var(--fs, 21px)*.28) 0;
      opacity: 0;
      transform: translateY(14px);
      transition: opacity .6s, transform .6s
    }

    .art li.on {
      opacity: 1;
      transform: none
    }

    .art li::marker {
      color: var(--v);
      font-weight: 800
    }

    .art ol ol {
      list-style: lower-alpha;
      margin-top: calc(var(--fs, 21px)*.2);
      font-size: .92em
    }

    /* modifiche a un documento: prima / dopo con differenze evidenziate */
    .mod .mt {
      position: absolute;
      left: 50px;
      right: 50px;
      top: 96px;
      margin: 0;
      font-size: 30px;
      font-weight: 800;
      color: var(--vd);
      line-height: 1.15
    }

    .mod .col {
      position: absolute;
      top: 158px;
      bottom: 76px;
      width: 575px;
      background: var(--w);
      border-radius: 24px;
      box-shadow: 0 12px 40px var(--shadow);
      padding: 22px 30px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-top: 12px solid
    }

    .mod .tg {
      align-self: flex-start;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1.5px;
      padding: 6px 16px;
      border-radius: 18px
    }

    .mod .tx {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      font-size: var(--fs, 24px);
      line-height: 1.4;
      font-weight: 500;
      color: var(--ink)
    }

    .mod del,
    .mod ins {
      text-decoration: none;
      border-radius: 4px;
      padding: 0 2px;
      transition: background .5s, color .5s
    }

    .mod.dif del {
      background: color-mix(in srgb, var(--r) 14%, transparent);
      color: var(--vd);
      text-decoration: none;
      border-bottom: 2px solid color-mix(in srgb, var(--r) 45%, transparent)
    }

    .mod.dif ins {
      background: color-mix(in srgb, var(--g) 18%, transparent);
      color: var(--g);
      font-weight: 700
    }

    .mod .nt2 {
      position: absolute;
      left: 50px;
      right: 50px;
      bottom: 20px;
      text-align: center;
      font-size: 15px;
      font-weight: 600;
      opacity: .75
    }

    /* modifiche documento: card unica con differenze nel testo */
    .mod .one .tx {
      transition: opacity .18s
    }

    .mod .one del {
      background: color-mix(in srgb, var(--r) 14%, transparent);
      color: var(--vd);
      text-decoration: none;
      border-bottom: 2px solid color-mix(in srgb, var(--r) 45%, transparent)
    }

    .mod .one ins {
      background: color-mix(in srgb, var(--g) 18%, transparent);
      color: var(--g);
      font-weight: 700
    }

    .mod .one .ch {
      background: color-mix(in srgb, var(--y) 55%, transparent);
      border-radius: 4px;
      padding: 0 3px
    }

    .mod .one .ch s {
      color: var(--v2);
      opacity: .75
    }

    .mod .one .ch b {
      color: var(--vd)
    }

    .mod .lg {
      display: flex;
      gap: 24px;
      justify-content: center;
      font-size: 14px;
      font-weight: 600
    }

    .mod .lg i {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 4px;
      margin-right: 6px;
      vertical-align: -2px
    }

    /* foto di gruppo (sfondo delle slide "foto" e "grazie") */
    #ph {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--vd), var(--v)) center/cover no-repeat;
      opacity: 0;
      transition: opacity .6s
    }

    .slide.photo {
      background: none !important;
      transform: none !important;
      opacity: 1 !important
    }

    .photo .gr {
      transform: translateX(115%);
      transition: transform .9s cubic-bezier(.2, .8, .2, 1)
    }

    .photo.in .gr {
      transform: none
    }

    .photo.out .gr {
      transform: translateX(-115%)
    }

    .bdg {
      margin-left: auto;
      margin-right: 18px;
      width: 60px;
      height: 60px;
      position: relative
    }

    .bdg svg {
      position: relative
    }

    .gr {
      position: absolute;
      left: 0;
      right: 0;
      top: 250px;
      height: 210px;
      background: var(--w85);
      backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      padding: 0 90px;
      gap: 40px
    }

    .gr h1 {
      font-size: 110px;
      margin: 0;
      font-weight: 700;
      color: var(--ink)
    }

    .gr .bb {
      width: 420px;
      height: 12px;
      border-radius: 6px;
      background: linear-gradient(90deg, var(--vl) 0 33%, var(--y) 33%)
    }

    .gr img {
      margin-left: auto;
      height: 140px
    }

    /* barra di avanzamento e contatore slide */
    #prog {
      position: absolute;
      left: 0;
      bottom: 0;
      height: 5px;
      background: var(--y);
      transition: width .5s;
      z-index: 5
    }

    #cnt {
      position: absolute;
      right: 20px;
      bottom: 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--v);
      opacity: .6;
      z-index: 5
    }

    #cnt.w {
      color: var(--w)
    }

    #msg {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      color: var(--w);
      text-align: center;
      padding: 30px;
      z-index: 9;
      background: var(--vd)
    }

    /* pulsanti di navigazione (home, menu, torna indietro) */
    #nav {
      position: absolute;
      left: 14px;
      bottom: 12px;
      z-index: 6;
      display: flex;
      gap: 6px
    }

    .nb {
      height: 28px;
      min-width: 28px;
      padding: 0 8px;
      gap: 5px;
      border: 0;
      border-radius: 14px;
      background: var(--glass);
      color: var(--w);
      font: 600 11px Montserrat, sans-serif;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: .35;
      transition: opacity .3s, transform .2s;
      backdrop-filter: blur(6px)
    }

    .nb svg {
      position: static;
      width: 14px;
      height: 14px;
      flex: none
    }

    .nb:active {
      transform: scale(.92)
    }

    .nb:hover {
      opacity: 1
    }

    .plus:before {
      content: "+"
    }

    .row.on.gone {
      opacity: 0;
      transform: translateX(-760px);
      transition: 1.1s cubic-bezier(.6, 0, .2, 1)
    }

    .row.rt {
      transform: translateX(60px)
    }

    .row.rt.on {
      transform: none
    }

    .pv {
      font-size: 11px;
      font-weight: 600;
      opacity: .7;
      white-space: nowrap;
      margin-top: 1px;
      font-variant-numeric: tabular-nums
    }

    .row {
      pointer-events: none
    }

    .row.on {
      pointer-events: auto
    }

    /* ============ ESPLOSIONE A RAGGIERA (ciambella patrimonio) ============ */
    .nt,
    .nt * {
      transition: none !important
    }

    .lb {
      position: absolute;
      width: 250px;
      opacity: 0;
      transform: scale(.6);
      transition: opacity .5s, transform .6s cubic-bezier(.2, 1.4, .4, 1)
    }

    .lb.on {
      opacity: 1;
      transform: none
    }

    .lb .bv,
    .zb .bv {
      font-size: 28px;
      font-weight: 800;
      color: var(--vd);
      font-variant-numeric: tabular-nums;
      white-space: nowrap
    }

    .lb .bn,
    .zb .bn {
      font-size: 14px;
      font-weight: 600;
      opacity: .8;
      line-height: 1.15
    }

    .md {
      position: absolute;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: var(--w);
      border: 5px solid;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px var(--shadow-strong);
      transform: scale(0);
      transition: transform .6s cubic-bezier(.2, 1.6, .4, 1)
    }

    .md.on {
      transform: scale(1)
    }

    .md img {
      height: 28px
    }

    .zbox {
      position: absolute;
      right: 56px;
      top: 100px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
      pointer-events: none
    }

    .zb {
      display: flex;
      align-items: center;
      gap: 14px
    }

    .zb .md {
      position: static;
      flex: none;
      transform: none
    }

    /* ordine del giorno con avanzamento */
    .os .tag {
      flex: none;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1.5px;
      padding: 7px 16px;
      border-radius: 18px;
      white-space: nowrap
    }

    .os .ck {
      animation: ospop .7s cubic-bezier(.2, 1.7, .4, 1) .9s both
    }

    @keyframes ospop {
      from {
        transform: scale(0) rotate(-40deg)
      }

      to {
        transform: none
      }
    }

    .os .nx {
      animation: osglow 2s ease-in-out 1.2s infinite
    }

    @keyframes osglow {

      0%,
      100% {
        box-shadow: 0 6px 20px var(--shadow-row), 0 0 0 0 color-mix(in srgb, var(--y) 55%, transparent)
      }

      50% {
        box-shadow: 0 6px 20px var(--shadow-row), 0 0 0 10px color-mix(in srgb, var(--y) 0%, transparent)
      }
    }

    /* segnalini sulla barra di progressione */
    #pm {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 5px;
      z-index: 6;
      pointer-events: none
    }

    .pmk {
      position: absolute;
      bottom: 0;
      width: 0;
      height: 5px
    }

    .pmk:before {
      content: "";
      position: absolute;
      left: -2px;
      bottom: 0;
      width: 4px;
      height: 5px;
      background: var(--v)
    }

    .pmk b {
      display: none;
      position: absolute;
      left: 0;
      bottom: 8px;
      transform: translateX(-50%);
      background: var(--v);
      color: var(--w);
      font: 800 8px Montserrat, sans-serif;
      min-width: 14px;
      text-align: center;
      padding: 2px 5px;
      border-radius: 8px;
      white-space: nowrap;
      box-shadow: 0 2px 8px var(--shadow-strong)
    }

    /* slide successiva = ordine del giorno: il numero compare con un "pop" */
    .pmk.nx b {
      display: block;
      transform: translateX(-50%) scale(1.5);
      animation: pmkin .55s cubic-bezier(.2, 1.7, .4, 1) both
    }

    @keyframes pmkin {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(10px) scale(0)
      }

      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0) scale(1.5)
      }
    }

    /* ===== ESPORTAZIONE PDF ===== */
    #pr {
      position: fixed;
      left: -20000px;
      top: 0;
      width: 1280px
    }

    #pr * {
      transition: none !important;
      animation: none !important
    }

    .ps {
      position: relative;
      width: 1280px;
      height: 720px;
      overflow: hidden;
      background: var(--bg);
      break-after: page;
      page-break-after: always
    }

    .ps .hd {
      z-index: 4
    }

    @media print {
      @page {
        size: 1280px 720px;
        margin: 0
      }

      html,
      body {
        height: auto !important;
        overflow: visible !important;
        background: none !important
      }

      body>*:not(#pr) {
        display: none !important
      }

      #pr {
        position: static !important;
        left: auto !important
      }

      * {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact
      }
    }
  </style>
</head>

<body>
  <div id="stage">
    <div id="ph"></div>
    <div id="hdr" class="hd off"><span></span><img src="img/logo.png"></div>
    <div id="prog"></div>
    <div id="cnt"></div>
    <div id="pm"></div>
  </div>
  <div id="msg">
    <div>Non trovo <b>dati.js</b> nella stessa cartella di questa pagina.</div>
  </div>
  <script src="config.js"></script>
  <script>
    const pm = document.getElementById('pm');
    const ph = document.getElementById('ph'), st = document.getElementById('stage'), prog = document.getElementById('prog'), cnt = document.getElementById('cnt');
    const HD = document.getElementById('hdr'), HDs = HD.querySelector('span');
    let INST = false, started = false;   /* INST = ricostruzione "istantanea" (dopo modifica a dati.js) */
    const V = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
    const C = [1, 2, 3, 4, 5, 6].map(i => V('--c' + i));
    const fmt = n => n.toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).replace('-', '−') + '€';
    const sum = a => a.reduce((s, x) => s + x, 0), NS = 'http://www.w3.org/2000/svg';

        zero.forEach(x => zb.append(h(`<div class="zb fade"><div class="md" style="border-color:var(${x.colore_css || '--vl'})"><img src="${x.icona}" onerror="this.style.display='none'"></div><div><div class="bv">${fmt(0)}</div><div class="bn">${x.nome}</div></div></div>`)));
        r.append(zb);
      }
      if (D.nota_beni_durevoli) r.append(h(`<div class="a" style="left:140px;right:140px;bottom:14px;text-align:center;font-size:13px;opacity:.65">${D.nota_beni_durevoli}</div>`));
      const tm = [], at = (ms, f) => tm.push(setTimeout(f, ms));
      const full = sg => sg.c.setAttribute('stroke-dasharray', `${Math.max(0, sg.s.f * L - 3)} ${L}`);
      return {
        steps: 0, show() {
          tm.forEach(clearTimeout); tm.length = 0;
          r.classList.add('nt');
          segs.forEach(sg => { sg.c.setAttribute('stroke-dasharray', `0 ${L}`); sg.g.style.transform = 'none' });
          items.forEach(o => { o.ln.style.strokeDashoffset = 1; o.lb.classList.remove('on'); o.md.classList.remove('on') });
          if (zb) [...zb.children].forEach(e => e.classList.remove('on'));
          ct._v = 0; ct.textContent = fmt(0); r.offsetWidth; r.classList.remove('nt');
          const tE = 400 + segs.length * 220 + 900;
          at(400, () => counter(ct, T, 1600));
          segs.forEach((sg, i) => at(400 + i * 220, () => full(sg)));
          at(tE, () => segs.forEach(sg => { sg.g.style.transform = `translate(${sg.s.cos * EX}px,${sg.s.sin * EX}px)` }));
          items.forEach(o => { const i = S.indexOf(o.s), t = tE + 500 + i * 350; at(t, () => o.md.classList.add('on')); at(t + 250, () => { o.ln.style.strokeDashoffset = 0; o.lb.classList.add('on') }) });
          if (zb) at(tE + 500 + items.length * 350 + 600, () => [...zb.children].forEach(e => e.classList.add('on')));
        }
      }
    };

    /* ---- slide_foto_gruppo / slide_grazie ---- */
    const photo = (g, s) => (r) => { r.classList.add('photo'); if (g) r.innerHTML = `<div class="gr"><h1>${s.testo || 'Grazie'}</h1><div class="bb"></div><img src="img/logo-grande.png"></div>`; cnt.className = 'w'; return { steps: 0, show() { } } };

    /* contatore passi: anello di avanzamento nella barra fissa (n = null lo nasconde) */
    function badge(n, N) {
      let e = HD.querySelector('.bdg'); const R = 25, Lc = 2 * Math.PI * R;
      if (!e) { e = h(`<div class="bdg"><svg width="60" height="60" style="position:relative;overflow:visible"><circle cx="30" cy="30" r="${R}" fill="none" style="stroke:var(--w)" stroke-opacity=".3" stroke-width="4"/><circle class="pg" cx="30" cy="30" r="${R}" fill="none" stroke-width="4" stroke-linecap="round" transform="rotate(-90 30 30)" stroke-dasharray="0 ${Lc}" style="stroke:var(--y);transition:stroke-dasharray .5s"/><text x="30" y="35" text-anchor="middle" style="fill:var(--w)" font-weight="700" font-family="Montserrat,sans-serif"></text></svg></div>`); HD.insertBefore(e, HD.querySelector('img')) }
      e.style.display = n == null ? 'none' : '';
      if (n == null) return;
      e.querySelector('.pg').setAttribute('stroke-dasharray', `${n / N * Lc} ${Lc}`);
      const t = e.querySelector('text'); t.textContent = n; t.setAttribute('font-size', N > 99 ? 13 : 16)
    }
    /* foto di gruppo: file esterno, nome 'foto di gruppo' */
    (function () {
      const c = [];['', 'img/'].forEach(d => ['jpg', 'jpeg', 'png', 'webp', 'JPG', 'JPEG', 'PNG'].forEach(e => c.push(d + 'foto di gruppo.' + e)));
      (function t(i) { if (i >= c.length) return; const im = new Image(); im.onload = () => ph.style.backgroundImage = `url("${c[i]}")`; im.onerror = () => t(i + 1); im.src = c[i] })(0)
    })();
    /* ---- slide_chiusura: assemblea conclusa + orario live ---- */
    const chiusura = x => (r, D) => {
      cnt.className = 'w'; r.classList.add('sec');
      r.innerHTML = `<div class="l"><img src="img/logo-grande.png"><div>Associazione<br>Guide e Scouts<br>Cattolici Italiani</div></div><div class="rr"><h1><b>${x.titolo || 'Assemblea conclusa'}</b></h1><h2>${x.sottotitolo ?? D.assemblea.titolo}</h2><div style="margin-top:34px;font-size:22px;font-weight:600;letter-spacing:3px;opacity:.85">ORE</div><div class="ck2" style="font-size:150px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-2px"></div><div class="d">${D.assemblea.data}</div></div>`;
      const el = r.querySelector('.ck2');
      const tick = () => {
        if (!r.isConnected) { clearInterval(iv); return }
        const n = new Date();
        el.textContent = String(n.getHours()).padStart(2, '0') + ':' + String(n.getMinutes()).padStart(2, '0')
      };
      const iv = setInterval(tick, 1000); tick();
      return { steps: 0, show() { } }
    };
    /* ---- motore ---- */
    let BN = 0, D, scenes = [], si = 0, sk = 0, cur = null, saved = null; const nav = h('<div id="nav"></div>'),
      bH = h('<button class="nb" title="Prima slide (H)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg></button>'),
      bM = h('<button class="nb" title="Ordine del giorno (M)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>'),
      bB = h('<button class="nb" title="Torna alla slide da cui eri partito (R)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span></span></button>');
    nav.append(bH, bM, bB); st.append(nav); bH.style.display = bM.style.display = bB.style.display = 'none';
    const odgIdx = () => Math.max(0, scenes.findIndex(s => s.tipo === 'slide_ordine_del_giorno'));
    const home = () => { if (si) { saved = { i: si, k: sk }; go(0, 0) } };
    const menu = () => { const t = odgIdx(); if (si !== t) { saved = { i: si, k: sk }; go(t, 0); go(t, cur.steps) } };
    const jump = id => { const t = scenes.findIndex(s => s.id === id); if (t < 0) return; saved = { i: si, k: sk }; go(t, 0) };
    const back = () => { if (saved) { const q = saved; saved = null; go(q.i, q.k) } };
    bH.onclick = e => { e.stopPropagation(); home() }; bM.onclick = e => { e.stopPropagation(); menu() }; bB.onclick = e => { e.stopPropagation(); back() };
    function go(i, k) {
      if (!cur || cur.i !== i) {
        const old = cur, r = h('<div class="slide"></div>'); st.insertBefore(r, HD);
        cur = { i, r, ...scenes[i].f(r, D) };
        if (INST) { r.classList.add('nt', 'in'); requestAnimationFrame(() => requestAnimationFrame(() => r.classList.remove('nt'))) }
        else requestAnimationFrame(() => requestAnimationFrame(() => r.classList.add('in')));
        if (old) { old.r.classList.remove('in'); old.r.classList.add('out'); setTimeout(() => old.r.remove(), 1000) }
        /* barra fissa: appare/scompare, e il testo cambia solo se è diverso */
        const t = r.dataset.hd, was = !HD.classList.contains('off');
        HD.classList.toggle('off', t === undefined);
        if (t !== undefined && HDs.textContent !== t) {
          if (!was || INST) { HDs.textContent = t; fitHd() }
          else { HDs.style.opacity = 0; setTimeout(() => { HDs.textContent = t; fitHd(); HDs.style.opacity = 1 }, 220) }
        }
      }
      if (saved && i === saved.i) saved = null; si = i; sk = k; cur.show(k); ph.style.opacity = scenes[i].ph ? 1 : 0;
      badge(scenes[i].b !== undefined ? scenes[i].b + k + 1 : null, BN);
      bB.style.display = saved && i !== saved.i ? 'flex' : 'none'; if (saved) bB.lastChild.textContent = 'Slide ' + (saved.i + 1); bH.style.display = i ? 'flex' : 'none'; bM.style.display = i !== odgIdx() ? 'flex' : 'none'; prog.style.width = ((i + 1) / scenes.length * 100) + '%';
      [...pm.children].forEach(e => { const j = +e.dataset.i; e.classList.toggle('nx', j === i + 1 && k >= cur.steps) }); cnt.textContent = (i + 1) + ' / ' + scenes.length; history.replaceState(null, '', '#' + i + '.' + k)
    }
    const next = () => { if (sk < cur.steps) go(si, sk + 1); else if (si < scenes.length - 1) go(si + 1, 0) };
    const prev = () => { if (sk > 0) go(si, sk - 1); else if (si > 0) { const n = si - 1; go(n, 0); go(n, cur.steps) } };
    addEventListener('keydown', e => { if (['ArrowRight', 'ArrowDown', ' ', 'PageDown', 'Enter'].includes(e.key)) { e.preventDefault(); next() } if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(e.key)) prev(); if (e.key === 'h') home(); if (e.key === 'm') menu(); if (e.key === 'r') back(); if (e.key === 'f') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen() });
    addEventListener('click', e => e.clientX < innerWidth * .2 ? prev() : next());
    let tx; addEventListener('touchstart', e => tx = e.touches[0].clientX); addEventListener('touchend', e => { const d = e.changedTouches[0].clientX - tx; if (Math.abs(d) > 50) { e.preventDefault(); d < 0 ? next() : prev() } });

    /* nomi vecchi -> nomi nuovi (i vecchi dati.js continuano a funzionare) */
    const ALIAS = { titolo: 'slide_titolo', sezione: 'slide_divisore_sezione', regolamento: 'slide_testo_articoli', testo: 'slide_testo_articoli', odg: 'slide_ordine_del_giorno', odg_stato: 'slide_avanzamento_odg', quorum: 'slide_quorum_convocazioni', organo: 'slide_composizione_organo', bilancio_cassa: 'slide_rendiconto_entrate_uscite', confronto: 'slide_rendiconto_scontrino_esito', andamento: 'slide_rendiconto_andamento_avanzo', patrimonio_barre: 'slide_patrimonio_barre', patrimonio_ciambella: 'slide_patrimonio_ciambella', foto: 'slide_foto_gruppo', grazie: 'slide_grazie' };
    /* tipi di slide disponibili */
    const T = {
      slide_titolo: x => sec(x.titolo, x.sottotitolo), slide_divisore_sezione: x => sec(x.titolo, x.sottotitolo),
      slide_testo_articoli: reg, slide_modifiche_documento: modifiche,
      slide_ordine_del_giorno: odg, slide_avanzamento_odg: odgStato, slide_quorum_convocazioni: quorum, slide_composizione_organo: organo,
      slide_rendiconto_entrate_uscite: cassa, slide_rendiconto_scontrino_esito: () => cmp, slide_rendiconto_andamento_avanzo: () => trend,
      slide_patrimonio_barre: () => bars, slide_patrimonio_ciambella: () => pie,
      slide_foto_gruppo: x => photo(0, x), slide_grazie: x => photo(1, x),
      slide_chiusura: chiusura,
      slide_differenze: differenze, slide_area_obiettivi: areaObiettivi, slide_prima_dopo: primaDopo, slide_cambio_date: cambioDate,
    };
    function start(data) {
      INST = started; started = true;
      D = { ...data, slide: (data.slide || []).map(x => ({ ...x, tipo: ALIAS[x.tipo] || x.tipo })) };
      document.getElementById('msg').style.display = 'none';
      st.querySelectorAll('.slide').forEach(e => e.remove()); cur = null; saved = null;
      const ST = { slide_rendiconto_entrate_uscite: D => D.entrate.length + 1 + D.uscite.length, slide_rendiconto_scontrino_esito: () => 3, slide_rendiconto_andamento_avanzo: () => 0, slide_patrimonio_barre: D => D.patrimonio.voci.length, slide_patrimonio_ciambella: () => 0 }; let base = 0;
      D.slide.forEach(x => { if (!x.nascosta && !T[x.tipo]) console.warn('Tipo di slide sconosciuto in dati.js:', x.tipo) });
      scenes = D.slide.filter(x => !x.nascosta && T[x.tipo]).map(x => { const o = { f: T[x.tipo](x), ph: x.tipo === 'slide_foto_gruppo' || x.tipo === 'slide_grazie', id: x.id, tipo: x.tipo, x }; if (ST[x.tipo]) { o.b = base; base += ST[x.tipo](D) + 1 } return o }); BN = base;
      pm.innerHTML = ''; const nP = (D.slide.find(q => q.tipo === 'slide_ordine_del_giorno') || { punti: [] }).punti.length;
      scenes.forEach((sc, i) => { if (sc.tipo === 'slide_ordine_del_giorno' || sc.tipo === 'slide_avanzamento_odg') { const n = sc.tipo === 'slide_ordine_del_giorno' ? '1' : (sc.x.completati >= nP ? '✓' : String((sc.x.completati || 0) + 1)); const e = h(`<div class="pmk" style="left:${(i + 1) / scenes.length * 100}%"><b>${n}</b></div>`); e.dataset.i = i; pm.append(e) } });
      const [a, b] = location.hash.slice(1).split('.').map(Number); go(Math.min(a || 0, scenes.length - 1), b || 0); INST = false
    }
    /* carica dati.js e lo ricontrolla ogni 2 secondi: se cambia, la presentazione si ricostruisce restando dov'eri */
    let last = null;
    function load(first) {
      /* prima carica progetto_educativo.js (opzionale), poi dati.js */
      const p = document.createElement('script'); p.src = 'progetto_educativo.js?t=' + Date.now();
      p.onload = p.onerror = () => { p.remove(); loadDati(first) };
      document.head.append(p);
    }
    function loadDati(first) {
      const s = document.createElement('script'); s.src = 'dati.js?t=' + Date.now();
      s.onload = () => { s.remove(); if (!window.DATI) { if (first) document.getElementById('msg').style.display = 'flex'; return } const j = JSON.stringify(window.DATI); if (j !== last) { last = j; start(window.DATI) } };
      s.onerror = () => { s.remove(); if (first) document.getElementById('msg').style.display = 'flex' };
      document.head.append(s);
    }
    /* titoli: il font si riduce se serve (barra e modifiche: max 2 righe; titolo/sezione: max 3 righe) */
    (function () {
      const css = document.createElement('style');
      css.textContent = '.hd span{line-height:1.05;flex:1;min-width:0;padding-right:16px;overflow-wrap:anywhere}.sec h1,.mod .mt{overflow-wrap:anywhere}';
      document.head.append(css);
      const fit = (el, max, min, lines = 2, maxH = 1e9) => {
        for (let f = max; f >= min; f--) {
          el.style.fontSize = f + 'px';
          const lh = parseFloat(getComputedStyle(el).lineHeight) || f * 1.15;
          if (el.offsetHeight <= Math.min(lines * lh, maxH) + 2) break;
        }
      };
      const all = () => {
        fit(HDs, 30, 14, 2);
        st.querySelectorAll('.sec h1').forEach(e => fit(e, 68, 24, 3));
        st.querySelectorAll('.mod .mt').forEach(e => fit(e, 30, 16, 2, 60));
      };
      new MutationObserver(all).observe(HDs, { childList: true, characterData: true });
      new MutationObserver(all).observe(st, { childList: true });
      if (document.fonts) document.fonts.ready.then(all);
    })();
    load(true); setInterval(load, window.LIVE && LIVE.ruolo === 'pubblico' ? 30000 : 1000);
    /* ---- esporta tutte le slide in PDF (stato finale, senza animazioni) ---- */
    let pdfBusy = false;
    async function exportPdf() {
      if (pdfBusy || !scenes.length) return; pdfBusy = true;
      const oldCnt = cnt.className, lbl = bP.querySelector('span'); lbl.textContent = 'Preparo…';
      INST = true;                                   /* contatori e animazioni istantanei */
      const P = document.createElement('div'); P.id = 'pr'; document.body.append(P);
      scenes.forEach(sc => {
        const ps = h('<div class="ps"></div>'); P.append(ps);
        if (sc.ph && ph.style.backgroundImage) ps.style.background = ph.style.backgroundImage + ' center/cover no-repeat';
        const r = h('<div class="slide in"></div>'); ps.append(r);
        const o = sc.f(r, D); o.show(o.steps);        /* ultimo passo = stato finale */
        if (r.dataset.hd !== undefined) {
          const hd = h('<div class="hd"><span></span><img src="img/logo.png"></div>');
          hd.firstChild.textContent = r.dataset.hd; ps.append(hd); fitTitle(hd.firstChild, 30, 14, 2);
        }
      });
      /* la ciambella del patrimonio usa dei timer: aspetta che finisca */
      const wait = scenes.some(s => s.tipo === 'slide_patrimonio_ciambella') ? 9000 : 1200;
      await new Promise(res => setTimeout(res, wait));
      if (document.fonts) await document.fonts.ready;
      const done = () => { P.remove(); INST = false; cnt.className = oldCnt; lbl.textContent = 'PDF'; pdfBusy = false; removeEventListener('afterprint', done) };
      addEventListener('afterprint', done);
      window.print();
    }
    const bP = h('<button class="nb" title="Salva tutte le slide come PDF (P)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4"/><path d="M4 20h16"/></svg><span>PDF</span></button>');
    bP.style.display = 'none'; nav.append(bP);
    bP.onclick = e => { e.stopPropagation(); exportPdf() };

    /* il bottone PDF si vede solo sull'ultima slide */
    const _go = go;
    go = (i, k) => { _go(i, k); bP.style.display = i === scenes.length - 1 ? 'flex' : 'none' };
    addEventListener('keydown', e => { if (e.key === 'p' && !e.ctrlKey && !e.metaKey && si === scenes.length - 1) exportPdf() });  </script>
