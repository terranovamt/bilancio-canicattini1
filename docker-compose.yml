services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    user: "${PUID:-1000}:${PGID:-1000}"
    shm_size: 1gb
    env_file:
      - .env
    environment:
      DATA_PATH: /data
    volumes:
      - ./data:/data
      - ./scontrini:/scontrini
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sqlite3; db=sqlite3.connect('file:/data/bot.sqlite3?mode=ro', uri=True); assert db.execute(\"SELECT 1 FROM sqlite_master WHERE type='table' AND name='expenses'\").fetchone(); assert db.execute('PRAGMA quick_check').fetchone()[0] == 'ok'",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
